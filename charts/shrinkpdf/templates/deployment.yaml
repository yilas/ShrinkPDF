apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shrinkpdf.fullname" . }}
  labels:
    {{- include "shrinkpdf.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shrinkpdf.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shrinkpdf.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 5000
          # Liveness : Est-ce que le processus Python a crashé ?
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          # Readiness : Est-ce que l'app peut compresser un PDF ?
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - mountPath: /tmp
              name: temp-volume
      volumes:
        - name: temp-volume
          emptyDir: {}
