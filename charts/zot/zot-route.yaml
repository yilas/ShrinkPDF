apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot-route
  namespace: inis-registry
spec:
  parentRefs:
  - name: shrink-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    - name: zot
      port: 5000
