kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-shrink
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    listenAddress: "127.0.0.1"
  - containerPort: 443
    hostPort: 443
    listenAddress: "127.0.0.1"
  - containerPort: 30500 # Port Zot
    hostPort: 5001
    listenAddress: "127.0.0.1"
- role: worker
- role: worker
